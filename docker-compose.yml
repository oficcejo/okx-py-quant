version: '3.8'

services:
  okx-quant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: okx-quant-app
    restart: unless-stopped
    ports:
      - "8000:8000"   # 全栈 Web 界面 + API + WebSocket 统一端口
    volumes:
      - ./data:/app/data                    # SQLite 数据库与数据持久化目录
      - ./okx_quant.db:/app/okx_quant.db    # 支持挂载根目录现有数据库文件
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/okx_quant.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  data:
    driver: local

